; MainMenuToggles.ini - every Show* option defaults to true (vanilla), false hides that element.
; Hidden elements are restored when the main menu closes or the hotkey toggles hiding off.


[General]

; Hide elements from game launch and on every main menu visit; false starts vanilla until ToggleKey is pressed.
HideOnStartup=true

; DirectInput scan code that toggles hiding while the main menu is open (0 = off, 87 = F11, 88 = F12, 199 = Home, 210 = Insert).
ToggleKey=0

; Write MainMenuToggles.log (settings, warnings and errors); false writes no log file.
EnableLogging=true


[Visibility]

; Buttons to keep, in display order, from Continue, New, Load, Creations, Credits, Quit (empty = vanilla, always applied).
MenuButtons=

; Main button list and other menu text (version, login hints, loading messages); the keyboard still navigates it while hidden.
ShowMenuButtons=true

; Rising smoke (particle system "PArray01" in meshes\interface\intmenufogparticles.nif).
ShowSmoke=true

; Silver dragon emblem on the main menu.
ShowDragonMenuLogo=true

; Dragon model on the main menu: Classic (logo.nif) or Anniversary (logo01ae.nif) (empty = vanilla Anniversary).
DragonMenuLogo=

; Silver dragon emblem on the loading screen before the main menu.
ShowDragonLoadingLogo=true

; Dragon model on the loading screen: Classic (logo.nif) or Anniversary (logo01ae.nif) (empty = vanilla Classic).
DragonLoadingLogo=

; Loading spinner in the bottom-right corner, before and on the main menu.
ShowLoadingSpinner=true

; Mouse cursor, only while the main menu is open.
ShowMouseCursor=true

; "Bethesda Game Studios" logo in the bottom-left corner.
ShowBethesdaLogo=true

; "CREATION CLUB NEWS" message-of-the-day panel.
ShowMOTD=true
